name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_CMDLINE_TOOLS: "12266719"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK manually
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

          export ANDROID_HOME=$RUNNER_WORKSPACE/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export CMDLINE_TOOLS=$ANDROID_HOME/cmdline-tools/latest
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip
          unzip -q commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip
          rm -f commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip
          mkdir -p $CMDLINE_TOOLS
          mv cmdline-tools/* $CMDLINE_TOOLS/ 2>/dev/null || true

          export PATH=$CMDLINE_TOOLS/bin:$ANDROID_HOME/platform-tools:$PATH

          yes | $CMDLINE_TOOLS/bin/sdkmanager --licenses >/dev/null || true
          $CMDLINE_TOOLS/bin/sdkmanager "platform-tools" "platforms;android-33" "platforms;android-34" "build-tools;33.0.1" "build-tools;34.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$CMDLINE_TOOLS/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV

          echo "sdk.dir=$ANDROID_HOME" > $GITHUB_WORKSPACE/local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
